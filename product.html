<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Black Shirt | Swatheesh Menswear</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">

        <div class="logo">
            <span>SWATHEESH</span>
            <small>MENSWEAR</small>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="shirts.html">Shirts</a>
            <a href="tshirts.html">T-Shirts</a>
            <a href="trousers.html">Trousers</a>
            <a href="jackets.html">Jackets</a>
        </div>

        <div class="nav-icons">
            <span>🔍</span>
            <span>♡</span>
            <span>🛍️</span>
        </div>

    </nav>


    <section class="product-details">

        <a href="product.html">
           <img src="shirts 1.jpg" alt="Premium Black Shirt">
        </a>


        <div class="product-detail-info">

            <p class="product-brand">SWATHEESH MENSWEAR</p>

            <h1>Premium Black Shirt</h1>

            <h2>₹1,999</h2>

            <p class="product-description">
                A premium black shirt designed with a clean,
                modern silhouette for effortless everyday style.
            </p>

            <div class="size-section option-section">

                <h3>SELECT SIZE</h3>

                <button class="option-button" data-option-group="size">S</button>
                <button class="option-button" data-option-group="size">M</button>
                <button class="option-button" data-option-group="size">L</button>
                <button class="option-button" data-option-group="size">XL</button>

                <h3>SELECT COLOUR</h3>

                <button class="option-button" data-option-group="color">Black</button>
                <button class="option-button" data-option-group="color">White</button>
                <button class="option-button" data-option-group="color">Navy</button>
                <button class="option-button" data-option-group="color">Beige</button>

            </div>

            <p class="selection-message" aria-live="polite"></p>

            <button class="add-bag product-action" data-action="add">
                ADD TO BAG
            </button>

            <button class="buy-now product-action" data-action="buy">
                BUY NOW
            </button>

        </div>

    </section>

    <script src="script.js"></script>
</body>

</html>
